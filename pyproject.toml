[project]
name = "biternionnet"
version = "0.1.0"
description = "PyTorch training pipeline for BiternionNets-style head pose experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "h5py==3.16.0",
    "matplotlib==3.10.9",
    "numpy==2.4.6",
    "opencv-python==4.13.0.92",
    "pytest==9.0.3",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "torch==2.12.0",
    "torchvision==0.27.0",
    "tqdm==4.67.3",
    "typer==0.25.1",
]

[project.optional-dependencies]
dev = []

[project.scripts]
biternion = "biternionnet.cli:app"
biternion-train = "biternionnet.cli:main_train"
biternion-eval = "biternionnet.cli:main_eval"
biternion-convert = "biternionnet.cli:main_convert"

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biternionnet"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
