generation:
  label_convention: yawpose
  intent_label_source: intent_s006
  camera_regime: yawpose_rear
  camera_elevation: {min: -30, max: 30, schedule: random_integer, zero_share: 70}
  # The closest integer allocation to the synthetic_004 20% outer-pitch policy.
  head_pitch: {min: -10, max: 10, outer_min_abs: 11, outer_max_abs: 25, outer_count: 142}
  roll: 0
  size_schedule:
    - {value: 1024x1536, share: 50}
    - {value: 1536x1024, share: 50}

qa:
  detector_score_threshold: 0.25
  head_height_ratio: {min: 0.25, max: 0.50}
  margin_min_head_ratio: 0.50
  require_single_head: true
  require_body_detection: true
  reject_duplicates: true
  reject_back: false
  pan_tolerance_deg: 30
  enforce_head_height_ratio: false
  deim_direction_max_bin_distance: 2
  rear_sixd_min_agreement: 0.70
  rear_deim_max_conflict: 0.10
  crop_margin_candidates: [0.05]
  deim_crop_margin: 0.05
  elevation:
    quantile: 0.90
    buffer_deg: 5.0
    minimum_threshold_deg: 10.0
    maximum_threshold_deg: 25.0
    minimum_negative_camera_ratio: 0.50

targets:
  yaw_bins: [100, 110]
  generation_instruction_count: 712

stages:
  yawpose_s006_712:
    count: 712
    shard_size: 500
    direct_production_allowed: true
    # Exact generation-instruction counts from synthetic_006_generation_spec.md §2.
    bin_counts: [242, 470]

